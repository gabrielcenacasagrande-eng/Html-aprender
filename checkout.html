<!DOCTYPE html> <html lang="pt-br"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Entrar no curso | HTML Academy</title> <link rel="stylesheet" href="style.css"> </head> <body class="checkout-body"> <div class="checkout-box"> <div class="logo center"> 🔥 HTML Academy </div> <h1>Comece seu aprendizado</h1> <p class="checkout-text"> Informe seus dados para entrar na área do curso. </p> <form onsubmit="entrar(event)"> <label for="nome">Seu nome</label> <input type="text" id="nome" placeholder="Digite seu nome" required > <label for="email">Seu e-mail</label> <input type="email" id="email" placeholder="Digite seu e-mail" required > <button type="submit" class="btn full"> Entrar no curso 🚀 </button> </form> <a href="index.html" class="back"> ← Voltar </a> </div> <script> function entrar(event) { event.preventDefault(); const nome = document.getElementById("nome").value.trim(); const email = document.getElementById("email").value.trim(); if (!nome || !email) { alert("Preencha todos os campos."); return; } localStorage.setItem("alunoNome", nome); localStorage.setItem("alunoEmail", email); window.location.href = "curso.html"; } </script> </body> </html>
